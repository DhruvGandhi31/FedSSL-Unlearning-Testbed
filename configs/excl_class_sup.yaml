# Exclusive-class scenario, relaxed: client 0 holds 90% of class-0 labels. ssl and sup must differ ONLY in lambda_u.
name: excl_class90_sup
seed: 0
data:
  num_clients: 10
  alpha: 0.3
  labeled_frac: 0.1
  data_seed: 0
  scenario: exclusive_class
  forget_class: 0
  forget_share: 0.2
  forget_label_share: 0.9
train:
  local_steps: 50
  lambda_u: 0.0
fed:
  rounds: 200
  participation: 0.5
  history_interval: 5
  eval_interval: 5
